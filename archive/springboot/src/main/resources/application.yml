server:
  port: 8080

spring:
  application:
    name: bookkeeping-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bookkeeping?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 数据库密码通过环境变量注入，避免明文提交到仓库
    password: ${MYSQL_PASSWORD:please-change-me}

mybatis-plus:
  configuration:
    # 数据库下划线字段自动映射为 Java 小驼峰属性（user_id -> userId）
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，生产环境建议关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 与 schema.sql 中的 AUTO_INCREMENT 主键对应
      id-type: auto
  # 自动为 com.bookkeeping.enums 包下的枚举注册 MyBatis-Plus 枚举类型处理器
  type-enums-package: com.bookkeeping.enums

bookkeeping:
  jwt:
    # HMAC 签名密钥，至少 32 字节；生产环境必须通过环境变量覆盖
    secret: ${JWT_SECRET:bookkeeping-dev-only-secret-key-must-be-at-least-32-bytes-long}
    # 令牌有效期（小时）
    expire-hours: 24
